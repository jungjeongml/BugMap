<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="screen-title">
<title id="screen-title">BugMap 첫 로그인 · 기본 화면</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<g id="block-0" data-type="image"><rect x="0" y="0" width="390" height="844" rx="4" fill="#f7f7f7" stroke="#888888"/></g>
<g id="block-1" data-type="text"><text x="24" y="28" font-family="sans-serif" font-size="14" fill="#222222">시스템 상태 표시 안전 영역</text></g>
<g id="block-2" data-type="box"><rect x="71" y="64" width="248" height="99" rx="4" fill="#f7f7f7" stroke="#888888"/></g>
<g id="block-3" data-type="image"><rect x="87" y="80" width="216" height="66.96" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="95" y="102" font-family="sans-serif" font-size="14" fill="#222222">BugMap-logo-vector</text></g>
<g id="block-4" data-type="box"><rect x="16" y="212" width="358" height="164" rx="4" fill="#f7f7f7" stroke="#888888"/></g>
<g id="block-5" data-type="text"><text x="32" y="246" font-family="sans-serif" font-size="14" fill="#222222">작은 발견이 모여,</text></g>
<g id="block-6" data-type="text"><text x="32" y="282" font-family="sans-serif" font-size="14" fill="#222222">살아 있는 지도가 돼요</text></g>
<g id="block-7" data-type="text"><text x="32" y="332" font-family="sans-serif" font-size="14" fill="#222222">발견한 곤충을 기록하고</text></g>
<g id="block-8" data-type="text"><text x="32" y="360" font-family="sans-serif" font-size="14" fill="#222222">지도에서 함께 나눠요.</text></g>
<g id="block-9" data-type="box"><rect x="24" y="400" width="342" height="104" rx="4" fill="#f7f7f7" stroke="#888888"/><text x="32" y="422" font-family="sans-serif" font-size="14" fill="#222222">개념 지도 · 기록 핀(장식)</text></g>
<g id="block-10" data-type="button"><rect x="16" y="548" width="358" height="60" rx="12" fill="#dddddd" stroke="#888888"/><text x="24" y="570" font-family="sans-serif" font-size="14" fill="#222222">카카오 로그인</text></g>
<g id="block-11" data-type="button"><rect x="16" y="616" width="358" height="60" rx="12" fill="#dddddd" stroke="#888888"/><text x="24" y="638" font-family="sans-serif" font-size="14" fill="#222222">네이버 로그인</text></g>
<g id="block-12" data-type="button"><rect x="16" y="684" width="358" height="60" rx="12" fill="#dddddd" stroke="#888888"/><text x="24" y="706" font-family="sans-serif" font-size="14" fill="#222222">Apple로 로그인</text></g>
<g id="block-13" data-type="text"><text x="32" y="780" font-family="sans-serif" font-size="14" fill="#222222">계속하면 이용약관 및 개인정보처리방침에</text></g>
<g id="block-14" data-type="text"><text x="32" y="802" font-family="sans-serif" font-size="14" fill="#222222">동의하게 됩니다.</text></g>
<g id="block-15" data-type="text"><text x="24" y="830" font-family="sans-serif" font-size="14" fill="#222222">홈 표시 안전 영역</text></g>
</svg>
